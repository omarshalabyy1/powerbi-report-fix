<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-label="Data flow through the six layers, left to right. Input files, demo only: prepare_data.py joins 4 source CSV files (sales, customer, store, product) into the flat export. Bronze layer: data/input/sales_flat.csv as received, 2,098,633 order lines, 35 columns, 801 MB; a client's own export starts here. Silver layer: the notebook loads the 11 mapped columns under standard names into DuckDB and writes output/sales.csv (2,098,633 rows, 11 columns); the Power Query query Sales Flat types it and is not loaded. Gold layer: no step in this repo. Semantic layer, the star schema built in Power Query: Sales fact (2,098,633 rows), Customer (88,063), Product (2,517) and Date (3,653 days, in DAX). Analytical layer: ten DAX measures. Reporting layer: the fixed report's Overview and Products pages. The slow report skips every layer: it reads the Bronze layer file as is into one flat table with 6 calculated columns and 3 hidden date tables. The check numbers both reports must show are worked out in SQL on the Silver layer and written to powerbi/06-checks.md and output/numbers.json; they are a check, not a layer.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0E1630; }
    .sub { font-size: 13.5px; fill: #475569; }
    .layer { font-size: 12.5px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 11.5px; fill: #506078; }
    .name { font-size: 12.5px; fill: #0F172A; }
    .count { font-size: 11.5px; fill: #506078; }
    .col { font-size: 12.5px; fill: #1E293B; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect x="1" y="1" width="998" height="548" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="40" y="50" class="title">Data flow, layer by layer</text>
  <text x="40" y="74" class="sub">One flat export feeds both reports: the fixed one through the six layers, the slow one straight from the Bronze layer.</text>
  <rect x="16" y="96" width="104" height="26" rx="13" fill="#94A3B8"/><text x="68.0" y="113.5" class="layer" text-anchor="middle">Input files</text>
  <text x="68.0" y="138" class="where" text-anchor="middle">demo only</text>
  <rect x="136" y="96" width="122" height="26" rx="13" fill="#3B82F6"/><text x="197.0" y="113.5" class="layer" text-anchor="middle">Bronze layer</text>
  <text x="197.0" y="138" class="where" text-anchor="middle">data/input</text>
  <rect x="274" y="96" width="134" height="26" rx="13" fill="#0EA5E9"/><text x="341.0" y="113.5" class="layer" text-anchor="middle">Silver layer</text>
  <text x="341.0" y="138" class="where" text-anchor="middle">notebook, Power Query</text>
  <rect x="424" y="96" width="104" height="26" rx="13" fill="#F59E0B"/><text x="476.0" y="113.5" class="layer" text-anchor="middle">Gold layer</text>
  <text x="476.0" y="138" class="where" text-anchor="middle">none</text>
  <rect x="544" y="96" width="128" height="26" rx="13" fill="#14B8A6"/><text x="608.0" y="113.5" class="layer" text-anchor="middle">Semantic layer</text>
  <text x="608.0" y="138" class="where" text-anchor="middle">the star schema</text>
  <rect x="688" y="96" width="122" height="26" rx="13" fill="#A855F7"/><text x="749.0" y="113.5" class="layer" text-anchor="middle">Analytical layer</text>
  <text x="749.0" y="138" class="where" text-anchor="middle">DAX measures</text>
  <rect x="826" y="96" width="158" height="26" rx="13" fill="#22C55E"/><text x="905.0" y="113.5" class="layer" text-anchor="middle">Reporting layer</text>
  <text x="905.0" y="138" class="where" text-anchor="middle">Power BI pages</text>
  <rect x="16" y="150" width="104" height="144" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="25" y="167" class="name">4 source</text><text x="25" y="183" class="count">CSV files</text>
  <text x="25" y="204" class="count">sales, customer,</text>
  <text x="25" y="220" class="count">store, product;</text>
  <text x="25" y="236" class="count">prepare_data.py</text>
  <text x="25" y="252" class="count">joins them</text>
  <rect x="136" y="150" width="122" height="144" rx="7" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4"/><text x="145" y="167" class="name">sales_flat.csv</text><text x="145" y="183" class="count">2,098,633 rows</text>
  <text x="145" y="204" class="count">35 columns, 801 MB</text>
  <text x="145" y="220" class="count">as received;</text>
  <text x="145" y="236" class="count">a client's export</text>
  <text x="145" y="252" class="count">starts here</text>
  <path d="M120 170.0 H136" class="edge" marker-end="url(#arrow)"/>
  <rect x="274" y="150" width="134" height="40" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.4"/><text x="283" y="167" class="name">sales, in DuckDB</text><text x="283" y="183" class="count">11 mapped columns</text>
  <rect x="274" y="202" width="134" height="40" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.4"/><text x="283" y="219" class="name">output/sales.csv</text><text x="283" y="235" class="count">2,098,633 rows, 11 cols</text>
  <rect x="274" y="254" width="134" height="40" rx="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.4"/><text x="283" y="271" class="name">Sales Flat query</text><text x="283" y="287" class="count">typed, not loaded</text>
  <path d="M258 170.0 H274" class="edge" marker-end="url(#arrow)"/>
  <path d="M341.0 190 V202" class="edge" marker-end="url(#arrow)"/>
  <path d="M341.0 242 V254" class="edge" marker-end="url(#arrow)"/>
  <rect x="424" y="150" width="104" height="40" rx="7" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="4 4"/><text x="476.0" y="167" class="count" text-anchor="middle">no step</text><text x="476.0" y="182" class="count" text-anchor="middle">in this repo</text>
  <rect x="544" y="202" width="128" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="553" y="219" class="name">Sales (fact)</text><text x="553" y="235" class="count">2,098,633 rows</text>
  <rect x="544" y="254" width="128" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="553" y="271" class="name">Customer</text><text x="553" y="287" class="count">88,063 rows</text>
  <rect x="544" y="306" width="128" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="553" y="323" class="name">Product</text><text x="553" y="339" class="count">2,517 rows</text>
  <rect x="544" y="358" width="128" height="40" rx="7" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.4"/><text x="553" y="375" class="name">Date, in DAX</text><text x="553" y="391" class="count">3,653 days</text>
  <path d="M408 265.0 C476.0 265.0 476.0 222.0 544 222.0" class="edge" marker-end="url(#arrow)"/>
  <path d="M408 274.0 H544" class="edge" marker-end="url(#arrow)"/>
  <path d="M408 283.0 C476.0 283.0 476.0 326.0 544 326.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="688" y="202" width="122" height="196" rx="7" fill="#FFFFFF" stroke="#A855F7" stroke-width="1.4"/><text x="697" y="219" class="name">10 DAX measures</text><text x="697" y="235" class="count">Sales Amount,</text>
  <text x="697" y="251" class="count">Margin %, Orders,</text>
  <text x="697" y="267" class="count">Avg Order Value,</text>
  <text x="697" y="283" class="count">Sales PY, YoY %,</text>
  <text x="697" y="299" class="count">Product Rank</text>
  <path d="M673 202 H678 V398 H673" class="edge" stroke="#14B8A6"/>
  <path d="M678 300.0 H688" class="edge" marker-end="url(#arrow)"/>
  <rect x="826" y="202" width="158" height="196" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.4"/><text x="836" y="222" class="name" font-weight="700">After: the fixed report</text>
  <rect x="838" y="270.0" width="134" height="26" rx="13" fill="#166534"/><text x="905.0" y="287.5" class="name" text-anchor="middle" style="fill:#FFFFFF">Overview</text>
  <rect x="838" y="306.0" width="134" height="26" rx="13" fill="#166534"/><text x="905.0" y="323.5" class="name" text-anchor="middle" style="fill:#FFFFFF">Products</text>
  <path d="M810 300.0 H826" class="edge" marker-end="url(#arrow)"/>
  <path d="M197.0 294 V430.0 H826" class="edge" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="278" y="423.0" class="count">reads the Bronze layer file as is: one flat table, 35 columns + 6 calculated, 3 hidden date tables</text>
  <rect x="826" y="410" width="158" height="40" rx="7" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.4" stroke-dasharray="4 4"/><text x="836" y="427" class="name" font-weight="700">Before: the slow report</text><text x="836" y="443" class="count">Overview, Products</text>
  <rect x="16" y="462" width="794" height="30" rx="7" fill="#64748B"/><text x="28" y="482" class="name" style="fill:#FFFFFF">check numbers: SQL on the Silver layer, written to powerbi/06-checks.md and output/numbers.json (a check, not a layer)</text>
  <text x="40" y="520" class="where">Both reports must show the numbers in 06-checks.md. measure.py adds page times and model size to numbers.json once the Power BI exports are in.</text>
  <text x="40" y="537" class="where">Customer and Product are built from the Sales Flat query, not from the fact. The Date table takes its first and last year from Sales.</text>
</svg>
