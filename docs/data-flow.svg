<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580.0" width="1000" height="580.0" role="img" aria-label="Data flow, step by step: prepare_data.py (demo only) joins four source CSV files (sales, customer, store, product) into data/input/sales_flat.csv, 2,098,633 order lines and 35 columns. The slow report reads it as is: one flat Sales table, 6 calculated columns and 3 hidden date tables. The notebook loads the 11 mapped columns into DuckDB, computes every check number in SQL and writes output/sales.csv (2,098,633 rows, 11 columns), powerbi/06-checks.md and output/numbers.json. The fixed report reads output/sales.csv through the staging query Sales Flat into a star: Sales (2,098,633 rows), Customer (88,063), Product (2,517) and Date (3,653 days, in DAX). Both reports have the Overview and Products pages. measure.py will read the Performance Analyzer and VertiPaq Analyzer exports of both reports; they are not taken yet.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .note { font-size: 12px; fill: #CBD5E1; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="580.0" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">Data flow, step by step</text>
  <text x="40" y="74" class="sub">One flat export feeds both reports: the slow one reads it as it is, the fixed one through the notebook.</text>
  <rect x="30" y="96" width="140" height="26" rx="13" fill="#94A3B8"/><text x="100.0" y="114" class="layer" text-anchor="middle">Input files</text>
  <text x="100.0" y="138" class="where" text-anchor="middle">data/demo/raw, demo only</text>
  <rect x="192" y="96" width="150" height="26" rx="13" fill="#3B82F6"/><text x="267.0" y="114" class="layer" text-anchor="middle">1  Flatten</text>
  <text x="267.0" y="138" class="where" text-anchor="middle">prepare_data.py, DuckDB</text>
  <rect x="364" y="96" width="140" height="26" rx="13" fill="#0EA5E9"/><text x="434.0" y="114" class="layer" text-anchor="middle">2  Compute</text>
  <text x="434.0" y="138" class="where" text-anchor="middle">analysis.ipynb, DuckDB</text>
  <rect x="534" y="96" width="170" height="26" rx="13" fill="#14B8A6"/><text x="619.0" y="114" class="layer" text-anchor="middle">3  Write</text>
  <text x="619.0" y="138" class="where" text-anchor="middle">output/ and powerbi/</text>
  <rect x="718" y="96" width="252" height="26" rx="13" fill="#22C55E"/><text x="844.0" y="114" class="layer" text-anchor="middle">4  Power BI</text>
  <text x="844.0" y="138" class="where" text-anchor="middle">the same two pages, twice</text>
  <rect x="30" y="150" width="140" height="144" rx="10" fill="#13233D" stroke="#94A3B8" stroke-opacity="0.7"/>
  <text x="42" y="172" class="name" font-weight="700">4 source</text>
  <text x="42" y="191" class="name">CSV files</text>

  <text x="42" y="229" class="note">sales, customer,</text>
  <text x="42" y="248" class="note">store, product</text>
  <rect x="192" y="150" width="150" height="144" rx="10" fill="#13233D" stroke="#3B82F6" stroke-opacity="0.7"/>
  <text x="204" y="172" class="name" font-weight="700">sales_flat.csv</text>
  <text x="204" y="191" class="count">2,098,633 rows</text>
  <text x="204" y="210" class="count">35 columns, 801 MB</text>

  <text x="204" y="248" class="note">one row per order line,</text>
  <text x="204" y="267" class="note">every column joined on</text>
  <text x="267" y="318" class="where" text-anchor="middle">a client's own export</text>
  <text x="267" y="334" class="where" text-anchor="middle">starts here, in data/input/</text>
  <path d="M170 222.0 H191" class="edge" marker-end="url(#arrow)"/>
  <rect x="364" y="254" width="140" height="40" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="374" y="271" class="name">sales</text><text x="374" y="287" class="count">11 mapped columns</text>
  <rect x="364" y="321.6" width="140" height="40" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7"/><text x="374" y="338.6" class="name">check numbers</text><text x="374" y="354.6" class="count">SQL, page by page</text>
  <path d="M342 274.0 H363" class="edge" marker-end="url(#arrow)"/>
  <line x1="434" y1="294" x2="434" y2="319.6" class="edge" marker-end="url(#arrow)"/>
  <rect x="534" y="254" width="170" height="40" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="544" y="271" class="name">output/sales.csv</text><text x="544" y="287" class="count">2,098,633 rows, 11 columns</text>
  <rect x="534" y="321.6" width="170" height="40" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="544" y="338.6" class="name">powerbi/06-checks.md</text><text x="544" y="354.6" class="count">what each page must show</text>
  <rect x="534" y="389.2" width="170" height="40" rx="7" fill="#13233D" stroke="#14B8A6" stroke-opacity="0.7"/><text x="544" y="406.2" class="name">output/numbers.json</text><text x="544" y="422.2" class="count">every number, for the README</text>
  <path d="M504 274.0 H533" class="edge" marker-end="url(#arrow)"/>
  <path d="M504 341.6 H533" class="edge" marker-end="url(#arrow)"/>
  <path d="M504 349.6 H512 V401.2 H533" class="edge" marker-end="url(#arrow)"/>
  <rect x="718" y="150" width="252" height="96" rx="10" fill="#13233D" stroke="#22C55E" stroke-opacity="0.7"/>
  <text x="730" y="172" class="name" font-weight="700">Before: the slow report</text>
  <text x="730" y="191" class="note">Sales, one flat table</text><text x="958" y="191" class="count" text-anchor="end">35 columns</text>
  <text x="730" y="210" class="note">calculated columns</text><text x="958" y="210" class="count" text-anchor="end">6</text>
  <text x="730" y="229" class="note">hidden date tables</text><text x="958" y="229" class="count" text-anchor="end">3</text>
  <rect x="718" y="254" width="252" height="175.2" rx="10" fill="#13233D" stroke="#22C55E" stroke-opacity="0.7"/>
  <text x="730" y="276" class="name" font-weight="700">After: the star schema</text>
  <text x="730" y="295" class="note">Sales, the fact</text><text x="958" y="295" class="count" text-anchor="end">2,098,633 rows</text>
  <text x="730" y="314" class="note">Customer</text><text x="958" y="314" class="count" text-anchor="end">88,063 rows</text>
  <text x="730" y="333" class="note">Product</text><text x="958" y="333" class="count" text-anchor="end">2,517 rows</text>
  <text x="730" y="352" class="note">Date, in DAX</text><text x="958" y="352" class="count" text-anchor="end">3,653 days</text>

  <text x="730" y="390" class="count">via staging query Sales Flat</text>
  <line x1="342" y1="170.0" x2="716" y2="170.0" class="edge" marker-end="url(#arrow)"/>
  <path d="M704 274.0 H717" class="edge" marker-end="url(#arrow)"/>
  <path d="M704 341.6 H716" class="edge" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="718.0" y="430.8" width="122.0" height="28" rx="14" fill="#166534"/><text x="779.0" y="449.8" class="name" text-anchor="middle">Overview</text>
  <rect x="848.0" y="430.8" width="122.0" height="28" rx="14" fill="#166534"/><text x="909.0" y="449.8" class="name" text-anchor="middle">Products</text>
  <rect x="364" y="430.8" width="140" height="40" rx="7" fill="#13233D" stroke="#0EA5E9" stroke-opacity="0.7" stroke-dasharray="4 4"/><text x="374" y="447.8" class="name">measure.py</text><text x="374" y="463.8" class="count">page times, model size</text>
  <path d="M844.0 458.8 V508.0 H434 V472.8" class="edge" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="836.0" y="526.0" class="where" text-anchor="end">Performance Analyzer and VertiPaq Analyzer exports, both reports: not taken yet</text>
  <path d="M504 450.8 H518 V417.2 H533" class="edge" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="40" y="554.0" class="where">dashed: checking and measuring. Both reports are compared with 06-checks.md; measure.py adds the timings to numbers.json once the exports are in.</text>
</svg>
