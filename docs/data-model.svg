  <text x="382" y="637" class="col">Customer Key</text><text x="618" y="637" class="key" fill="#93C5FD" text-anchor="end">FK</text>
  <text x="382" y="660" class="col">Product Key</text><text x="618" y="660" class="key" fill="#93C5FD" text-anchor="end">FK</text>
