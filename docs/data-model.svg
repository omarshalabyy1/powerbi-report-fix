  <path d="M40 142 a10 10 0 0 1 10 -10 h900 a10 10 0 0 1 10 10 v36 h-920 Z" fill="#2563EB"/>
  <text x="52" y="152" class="name" font-weight="700" style="fill:#FFFFFF">Sales</text><text x="52" y="169" class="count" style="fill:#FFFFFF">2,098,633 rows · 35 columns from the export + 6 calculated</text>
