  <rect x="350" y="433" width="300" height="30" rx="8" fill="#13233D" stroke="#94A3B8" stroke-dasharray="5 4"/><text x="362" y="453" class="note">hidden date table for Delivery Date</text>
  <rect x="660" y="433" width="300" height="30" rx="8" fill="#13233D" stroke="#94A3B8" stroke-dasharray="5 4"/><text x="672" y="453" class="note">hidden date table for Birthday</text>
  <text x="40" y="507" class="layer" style="fill:#F1F5F9">After: a star schema, auto date/time off</text>
