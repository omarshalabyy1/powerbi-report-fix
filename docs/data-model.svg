<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 853" width="1000" height="853" role="img" aria-label="Before and after, the Power BI model. Before: one flat Sales table of 2,098,633 rows with all 35 columns of the export plus 6 calculated columns (Line Amount, Line Cost, Line Margin, Year, Month, Month Number), and three hidden date tables that auto date/time builds for Order Date, Delivery Date and Birthday; no relationships. After: a star schema. The Sales fact (2,098,633 rows) keeps 7 columns, keys and numbers only, and joins many to one to Product (2,517 rows) on Product Key, Customer (88,063) on Customer Key and Date (3,653 days, built in DAX and marked as the date table) on Order Date. 41 columns become 17.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .layer { font-size: 14px; font-weight: 700; fill: #0B1220; }
    .where { font-size: 12px; fill: #94A3B8; }
    .name { font-size: 13px; fill: #F1F5F9; }
    .count { font-size: 11.5px; fill: #94A3B8; }
    .note { font-size: 12px; fill: #CBD5E1; }
    .col { font-size: 12.5px; fill: #E2E8F0; }
    .key { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748B; stroke-width: 1.4; }
  </style>
  <rect width="1000" height="853" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">The Power BI model, before and after</text>
  <text x="40" y="74" class="sub">The same 2,098,633 order lines. 41 columns in one table become 17 columns in a star.</text>
  <text x="40" y="120" class="layer" style="fill:#F1F5F9">Before: one flat table, no relationships</text>
