<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="How it works: 01 Measure, time every page and visual with Performance Analyzer and DAX Studio; 02 Model, the flat table rebuilt as a star schema with a proper date table; 03 DAX, slow measures rewritten with variables and the right filter context; 04 Check, compare every number before and after: only the speed may change; 05 Hand over, the report, the timings and a note of every change.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10213A"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .num { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .step { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 12.5px; fill: #94A3B8; }
    .link { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 4 5; }
  </style>

  <rect width="1000" height="290" rx="22" fill="url(#bg)"/>
  <text x="30" y="50" class="title">How it works</text>
  <text x="30" y="74" class="sub">Measure first, change the model and the DAX, prove the numbers did not move, then hand it over.</text>

  <path class="link" d="M202 180h20M394 180h20M586 180h20M778 180h20"/>

  <g>
    <rect x="30" y="105" width="172" height="150" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
    <circle cx="60" cy="137" r="16" fill="#3B82F6" fill-opacity="0.35"/>
    <text x="60" y="142" class="num" text-anchor="middle">01</text>
    <text x="85" y="143" class="step">Measure</text>
    <text x="46" y="180" class="desc">Time every slow page</text>
    <text x="46" y="199" class="desc">and visual with</text>
    <text x="46" y="218" class="desc">Performance Analyzer</text>
    <text x="46" y="237" class="desc">and DAX Studio</text>
  </g>

  <g>
    <rect x="222" y="105" width="172" height="150" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
    <circle cx="252" cy="137" r="16" fill="#3B82F6" fill-opacity="0.35"/>
    <text x="252" y="142" class="num" text-anchor="middle">02</text>
    <text x="277" y="143" class="step">Model</text>
    <text x="238" y="180" class="desc">The flat table rebuilt</text>
    <text x="238" y="199" class="desc">as a star schema with</text>
    <text x="238" y="218" class="desc">a proper date table</text>
  </g>

  <g>
    <rect x="414" y="105" width="172" height="150" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
    <circle cx="444" cy="137" r="16" fill="#3B82F6" fill-opacity="0.35"/>
    <text x="444" y="142" class="num" text-anchor="middle">03</text>
    <text x="469" y="143" class="step">DAX</text>
    <text x="430" y="180" class="desc">Slow measures rewritten</text>
    <text x="430" y="199" class="desc">with variables and the</text>
    <text x="430" y="218" class="desc">right filter context</text>
  </g>

  <g>
    <rect x="606" y="105" width="172" height="150" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
    <circle cx="636" cy="137" r="16" fill="#3B82F6" fill-opacity="0.35"/>
    <text x="636" y="142" class="num" text-anchor="middle">04</text>
    <text x="661" y="143" class="step">Check</text>
    <text x="622" y="180" class="desc">Compare every number</text>
    <text x="622" y="199" class="desc">before and after:</text>
    <text x="622" y="218" class="desc">only the speed</text>
    <text x="622" y="237" class="desc">may change</text>
  </g>

  <g>
    <rect x="798" y="105" width="172" height="150" rx="14" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-opacity="0.7"/>
    <circle cx="828" cy="137" r="16" fill="#3B82F6" fill-opacity="0.35"/>
    <text x="828" y="142" class="num" text-anchor="middle">05</text>
    <text x="853" y="143" class="step">Hand over</text>
    <text x="814" y="180" class="desc">Hand over the report,</text>
    <text x="814" y="199" class="desc">the timings and a note</text>
    <text x="814" y="218" class="desc">of every change</text>
  </g>
</svg>
